<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening anime page | MAL Clone</title>
  </head>
  <body>
    <p>Opening anime page...</p>
    <script>
      const title = new URLSearchParams(window.location.search).get('title');
      window.location.replace(title ? `/anime/${encodeURIComponent(title)}` : '/');
    </script>
  </body>
</html>
